   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(369.381406 147.921563)">Warm windows</text>
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(363.941719 162.861406)">new latents only</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(590.19375 133.17375)">Cache freed</text>
