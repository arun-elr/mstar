   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #e69f00" x="244.8" y="96.48" transform="rotate(-0 244.8 96.48)">stateless, one window</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #d55e00" transform="translate(281.181563 247.51125)">Window lands on another copy: not handled yet</text>
