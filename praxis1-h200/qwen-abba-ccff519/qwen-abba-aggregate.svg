<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="920" viewBox="0 0 1160 920"><rect width="1160" height="920" fill="#ffffff"/><style>text{font-family:Inter,DejaVu Sans,Arial,sans-serif}</style><text x="56" y="58" fill="#172638" font-size="29" font-weight="650" text-anchor="start">Qwen3.5-2B aggregate stack A/B</text><text x="56" y="90" fill="#536575" font-size="15" font-weight="400" text-anchor="start">One H200; six fresh servers in main / E5 / E5 / main / main / E5 order</text><text x="56" y="128" fill="#172638" font-size="21" font-weight="600" text-anchor="start">Streaming throughput</text><text x="56" y="150" fill="#536575" font-size="14" font-weight="400" text-anchor="start">32 output chunks per request; positive delta means more chunks per second</text><line x1="584" y1="175" x2="584" y2="338" stroke="#dce4e8" stroke-width="1"/><text x="584" y="356" fill="#536575" font-size="12" font-weight="400" text-anchor="middle">-3%</text><line x1="656" y1="175" x2="656" y2="338" stroke="#dce4e8" stroke-width="1"/><text x="656" y="356" fill="#536575" font-size="12" font-weight="400" text-anchor="middle">-2%</text><line x1="728" y1="175" x2="728" y2="338" stroke="#dce4e8" stroke-width="1"/><text x="728" y="356" fill="#536575" font-size="12" font-weight="400" text-anchor="middle">-1%</text><line x1="800" y1="175" x2="800" y2="338" stroke="#738695" stroke-width="2"/><text x="800" y="356" fill="#536575" font-size="12" font-weight="400" text-anchor="middle">0</text><line x1="872" y1="175" x2="872" y2="338" stroke="#dce4e8" stroke-width="1"/><text x="872" y="356" fill="#536575" font-size="12" font-weight="400" text-anchor="middle">+1%</text><line x1="944" y1="175" x2="944" y2="338" stroke="#dce4e8" stroke-width="1"/><text x="944" y="356" fill="#536575" font-size="12" font-weight="400" text-anchor="middle">+2%</text><line x1="1016" y1="175" x2="1016" y2="338" stroke="#dce4e8" stroke-width="1"/><text x="1016" y="356" fill="#536575" font-size="12" font-weight="400" text-anchor="middle">+3%</text><text x="56" y="218" fill="#172638" font-size="15" font-weight="500" text-anchor="start">C1: main 507, E5 508 chunks/s</text><line x1="800" y1="213" x2="823.5559732031945" y2="213" stroke="#0b8f82" stroke-width="5"/><circle cx="823.5559732031945" cy="213" r="7" fill="#0b8f82" stroke="#ffffff" stroke-width="2"/><text x="1075" y="218" fill="#0b8f82" font-size="15" font-weight="600" text-anchor="end">+0.33%</text><text x="56" y="267" fill="#172638" font-size="15" font-weight="500" text-anchor="start">C4: main 1,600, E5 1,611 chunks/s</text><line x1="800" y1="262" x2="847.7269932910926" y2="262" stroke="#0b8f82" stroke-width="5"/><circle cx="847.7269932910926" cy="262" r="7" fill="#0b8f82" stroke="#ffffff" stroke-width="2"/><text x="1075" y="267" fill="#0b8f82" font-size="15" font-weight="600" text-anchor="end">+0.66%</text><text x="56" y="316" fill="#172638" font-size="15" font-weight="500" text-anchor="start">C16: main 4,115, E5 4,137 chunks/s</text><line x1="800" y1="311" x2="838.1566868893508" y2="311" stroke="#0b8f82" stroke-width="5"/><circle cx="838.1566868893508" cy="311" r="7" fill="#0b8f82" stroke="#ffffff" stroke-width="2"/><text x="1075" y="316" fill="#0b8f82" font-size="15" font-weight="600" text-anchor="end">+0.53%</text><text x="56" y="410" fill="#172638" font-size="21" font-weight="600" text-anchor="start">Total request latency</text><text x="56" y="432" fill="#536575" font-size="14" font-weight="400" text-anchor="start">Median of three fresh-server p50 or p95 values; positive delta means slower</text><line x1="584" y1="453" x2="584" y2="745" stroke="#dce4e8" stroke-width="1"/><text x="584" y="765" fill="#536575" font-size="12" font-weight="400" text-anchor="middle">-3%</text><line x1="656" y1="453" x2="656" y2="745" stroke="#dce4e8" stroke-width="1"/><text x="656" y="765" fill="#536575" font-size="12" font-weight="400" text-anchor="middle">-2%</text><line x1="728" y1="453" x2="728" y2="745" stroke="#dce4e8" stroke-width="1"/><text x="728" y="765" fill="#536575" font-size="12" font-weight="400" text-anchor="middle">-1%</text><line x1="800" y1="453" x2="800" y2="745" stroke="#738695" stroke-width="2"/><text x="800" y="765" fill="#536575" font-size="12" font-weight="400" text-anchor="middle">0</text><line x1="872" y1="453" x2="872" y2="745" stroke="#dce4e8" stroke-width="1"/><text x="872" y="765" fill="#536575" font-size="12" font-weight="400" text-anchor="middle">+1%</text><line x1="944" y1="453" x2="944" y2="745" stroke="#dce4e8" stroke-width="1"/><text x="944" y="765" fill="#536575" font-size="12" font-weight="400" text-anchor="middle">+2%</text><line x1="1016" y1="453" x2="1016" y2="745" stroke="#dce4e8" stroke-width="1"/><text x="1016" y="765" fill="#536575" font-size="12" font-weight="400" text-anchor="middle">+3%</text><text x="56" y="482" fill="#172638" font-size="15" font-weight="500" text-anchor="start">C1 p50: main 62.9, E5 62.7 ms</text><line x1="800" y1="477" x2="775.2827365851653" y2="477" stroke="#22354c" stroke-width="5"/><circle cx="775.2827365851653" cy="477" r="7" fill="#22354c" stroke="#ffffff" stroke-width="2"/><text x="1075" y="482" fill="#22354c" font-size="15" font-weight="600" text-anchor="end">-0.34%</text><text x="56" y="531" fill="#172638" font-size="15" font-weight="500" text-anchor="start">C1 p95: main 63.9, E5 63.8 ms</text><line x1="800" y1="526" x2="789.0858666990541" y2="526" stroke="#0b8f82" stroke-width="5"/><circle cx="789.0858666990541" cy="526" r="7" fill="#0b8f82" stroke="#ffffff" stroke-width="2"/><text x="1075" y="531" fill="#0b8f82" font-size="15" font-weight="600" text-anchor="end">-0.15%</text><text x="56" y="580" fill="#172638" font-size="15" font-weight="500" text-anchor="start">C4 p50: main 76.9, E5 76.7 ms</text><line x1="800" y1="575" x2="772.4755553696182" y2="575" stroke="#22354c" stroke-width="5"/><circle cx="772.4755553696182" cy="575" r="7" fill="#22354c" stroke="#ffffff" stroke-width="2"/><text x="1075" y="580" fill="#22354c" font-size="15" font-weight="600" text-anchor="end">-0.38%</text><text x="56" y="629" fill="#172638" font-size="15" font-weight="500" text-anchor="start">C4 p95: main 79.9, E5 79.2 ms</text><line x1="800" y1="624" x2="735.8030319780373" y2="624" stroke="#0b8f82" stroke-width="5"/><circle cx="735.8030319780373" cy="624" r="7" fill="#0b8f82" stroke="#ffffff" stroke-width="2"/><text x="1075" y="629" fill="#0b8f82" font-size="15" font-weight="600" text-anchor="end">-0.89%</text><text x="56" y="678" fill="#172638" font-size="15" font-weight="500" text-anchor="start">C16 p50: main 104.7, E5 104.8 ms</text><line x1="800" y1="673" x2="801.0544301517124" y2="673" stroke="#22354c" stroke-width="5"/><circle cx="801.0544301517124" cy="673" r="7" fill="#22354c" stroke="#ffffff" stroke-width="2"/><text x="1075" y="678" fill="#22354c" font-size="15" font-weight="600" text-anchor="end">+0.01%</text><text x="56" y="727" fill="#172638" font-size="15" font-weight="500" text-anchor="start">C16 p95: main 111.1, E5 113.4 ms</text><line x1="800" y1="722" x2="947.6858427207427" y2="722" stroke="#0b8f82" stroke-width="5"/><circle cx="947.6858427207427" cy="722" r="7" fill="#0b8f82" stroke="#ffffff" stroke-width="2"/><text x="1075" y="727" fill="#0b8f82" font-size="15" font-weight="600" text-anchor="end">+2.05%</text><text x="56" y="811" fill="#536575" font-size="12" font-weight="400" text-anchor="start">3 runs/arm, 8 warmups + 50 measured requests at C1/C4/C16; 32 streamed output chunks/request.</text><text x="56" y="830" fill="#536575" font-size="12" font-weight="400" text-anchor="start">Main df256450, E5 ccff519; both use -O0 and captured Qwen graphs. Aggregate stack, no per-PR attribution.</text><text x="56" y="849" fill="#536575" font-size="12" font-weight="400" text-anchor="start">Three runs/arm; observed ranges are in the JSON. This repeated-prompt workload limits generalization.</text><text x="56" y="868" fill="#536575" font-size="12" font-weight="400" text-anchor="start">Output hash sets match per prompt; batched runs can select different completions. No gain/regression claim.</text><text x="56" y="887" fill="#536575" font-size="12" font-weight="400" text-anchor="start">Run ranges, TTFT, output hash sets and source/config pins are in the aggregate JSON and provenance.</text></svg>
