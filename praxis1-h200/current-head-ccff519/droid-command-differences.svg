<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><rect width="1000" height="600" fill="#ffffff"/><style>text{font-family:Inter,DejaVu Sans,Arial,sans-serif}</style><text x="60" y="56" fill="#172638" font-size="28" font-weight="650" text-anchor="start">Composed command differences</text><text x="60" y="86" fill="#536575" font-size="15" font-weight="400" text-anchor="start">Same synthetic observation bytes and seed; 4,485 actuator values across 5 sessions (incl. warmup)</text><rect x="60" y="111" width="13" height="13" rx="2" fill="#22354c"/><text x="80" y="123" fill="#536575" font-size="14" font-weight="400" text-anchor="start">95th percentile absolute difference</text><rect x="366" y="111" width="13" height="13" rx="2" fill="#0b8f82"/><text x="386" y="123" fill="#536575" font-size="14" font-weight="400" text-anchor="start">maximum absolute difference</text><line x1="290.0" y1="165" x2="290.0" y2="475" stroke="#dce4e8" stroke-width="1"/><text x="290.0" y="502" fill="#536575" font-size="12" font-weight="400" text-anchor="middle">0.00</text><line x1="420.0" y1="165" x2="420.0" y2="475" stroke="#dce4e8" stroke-width="1"/><text x="420.0" y="502" fill="#536575" font-size="12" font-weight="400" text-anchor="middle">0.02</text><line x1="550.0" y1="165" x2="550.0" y2="475" stroke="#dce4e8" stroke-width="1"/><text x="550.0" y="502" fill="#536575" font-size="12" font-weight="400" text-anchor="middle">0.04</text><line x1="680.0" y1="165" x2="680.0" y2="475" stroke="#dce4e8" stroke-width="1"/><text x="680.0" y="502" fill="#536575" font-size="12" font-weight="400" text-anchor="middle">0.06</text><line x1="810.0" y1="165" x2="810.0" y2="475" stroke="#dce4e8" stroke-width="1"/><text x="810.0" y="502" fill="#536575" font-size="12" font-weight="400" text-anchor="middle">0.08</text><text x="60" y="215" fill="#172638" font-size="16" font-weight="550" text-anchor="start">Cold, 21 rows</text><rect x="290" y="185" width="223.50398846901953" height="21" rx="4" fill="#22354c"/><rect x="290" y="218" width="348.8861173391342" height="21" rx="4" fill="#0b8f82"/><text x="521.5039884690195" y="201" fill="#22354c" font-size="13" font-weight="600" text-anchor="start">0.034</text><text x="646.8861173391342" y="234" fill="#0b8f82" font-size="13" font-weight="600" text-anchor="start">0.054</text><text x="60" y="325" fill="#172638" font-size="16" font-weight="550" text-anchor="start">Warm 1, 24 rows</text><rect x="290" y="295" width="230.12074828147888" height="21" rx="4" fill="#22354c"/><rect x="290" y="328" width="523.328885436058" height="21" rx="4" fill="#0b8f82"/><text x="528.1207482814789" y="311" fill="#22354c" font-size="13" font-weight="600" text-anchor="start">0.035</text><text x="821.328885436058" y="344" fill="#0b8f82" font-size="13" font-weight="600" text-anchor="start">0.081</text><text x="60" y="435" fill="#172638" font-size="16" font-weight="550" text-anchor="start">Warm 2, 24 rows</text><rect x="290" y="405" width="288.0471311509609" height="21" rx="4" fill="#22354c"/><rect x="290" y="438" width="429.8320524394512" height="21" rx="4" fill="#0b8f82"/><text x="586.0471311509609" y="421" fill="#22354c" font-size="13" font-weight="600" text-anchor="start">0.044</text><text x="727.8320524394512" y="454" fill="#0b8f82" font-size="13" font-weight="600" text-anchor="start">0.066</text><text x="60" y="550" fill="#536575" font-size="12" font-weight="400" text-anchor="start">Pose and grip values only; reference timestamp metadata is excluded.</text><text x="60" y="570" fill="#536575" font-size="12" font-weight="400" text-anchor="start">This is output difference, not an acceptance threshold or closed-loop parity measure.</text></svg>
