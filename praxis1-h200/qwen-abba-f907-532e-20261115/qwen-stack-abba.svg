<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="752" viewBox="0 0 1140 752"><rect width="100%" height="100%" fill="white"/><style>text{font-family:Inter,DejaVu Sans,Arial,sans-serif}</style><text x="56" y="55" fill="#172638" font-size="28" font-weight="650" text-anchor="start">Qwen3.5-2B combined-stack A/B</text><text x="56" y="86" fill="#536575" font-size="15" font-weight="400" text-anchor="start">One H200; six fresh servers in base / stack / stack / base / base / stack order</text><text x="56" y="118" fill="#536575" font-size="14" font-weight="400" text-anchor="start">3 runs per arm, 8 warmups + 50 measured requests at each concurrency</text><text x="56" y="165" fill="#172638" font-size="21" font-weight="600" text-anchor="start">Streaming throughput</text><text x="56" y="188" fill="#536575" font-size="14" font-weight="400" text-anchor="start">Median of three process rates; positive change means more output chunks per second</text><line x1="530" y1="210" x2="530" y2="368" stroke="#dce4e8" stroke-width="1"/><text x="530" y="391" fill="#536575" font-size="12" font-weight="400" text-anchor="middle">-4%</text><line x1="640" y1="210" x2="640" y2="368" stroke="#dce4e8" stroke-width="1"/><text x="640" y="391" fill="#536575" font-size="12" font-weight="400" text-anchor="middle">-2%</text><line x1="750" y1="210" x2="750" y2="368" stroke="#22354c" stroke-width="2"/><text x="750" y="391" fill="#536575" font-size="12" font-weight="400" text-anchor="middle">0</text><line x1="860" y1="210" x2="860" y2="368" stroke="#dce4e8" stroke-width="1"/><text x="860" y="391" fill="#536575" font-size="12" font-weight="400" text-anchor="middle">+2%</text><line x1="970" y1="210" x2="970" y2="368" stroke="#dce4e8" stroke-width="1"/><text x="970" y="391" fill="#536575" font-size="12" font-weight="400" text-anchor="middle">+4%</text><line x1="530" y1="440" x2="530" y2="598" stroke="#dce4e8" stroke-width="1"/><text x="530" y="621" fill="#536575" font-size="12" font-weight="400" text-a