" y="425" fill="#172638" font-size="21" font-weight="600" text-anchor="start">Total request latency</text><text x="56" y="448" fill="#536575" font-size="14" font-weight="400" text-anchor="start">Median of three process p50 values; positive change means slower</text><text x="56" y="490" fill="#172638" font-size="15" font-weight="400" text-anchor="start">C1: base 62.6, stack 62.5 ms</text><line x1="750" y1="485" x2="743.421481973988" y2="485" stroke="#0b8f82" stroke-width="5"/><circle cx="743.421481973988" cy="485" r="7" fill="#0b8f82" stroke="white" stroke-width="2"/><text x="1057" y="490" fill="#0b8f82" font-size="15" font-weight="600" text-anchor="end">-0.12%</text><text x="56" y="542" fill="#172638" font-size="15" font-weight="400" text-anchor="start">C4: base 77.3, stack 77.4 ms</text><line x1="750" y1="537" x2="758.2497765309505" y2="537" stroke="#0b8f82" stroke-width="5"/><circle cx="758.2497765309505" cy="537" r="7" fill="#0b8f82" stroke="white" stroke-width="2"/><text x="1057" y="542" fill="#0b8f82" font-size="15" font-weight="600" text-anchor="end">+0.15%</text><text x="56" y="594" fill="#172638" font-size="15" font-weight="400" text-anchor="start">C16: base 105.6, stack 107.7 ms</text><line x1="750" y1="589" x2="861.4291187350001" y2="589" stroke="#0b8f82" stroke-width="5"/><circle cx="861.4291187350001" cy="589" r="7" fill="#0b8f82" stroke="white" stroke-width="2"/><text x="1057" y="594" fill="#0b8f82" font-size="15" font-weight="600" text-anchor="end">+2.03%</text><text x="56" y="660" fill="#536575" font-size="12" font-weight="400" text-anchor="start">Base f9073827 is the pinned merge base; stack 532e6566 includes all episode, attention and Praxis commits.</text><text x="56" y="681" fill="#536575" font-size="12" font-weight="400" text-anchor="start">Four short prompts repeat with prefix caching. Prompt 0 has two output hashes in both arms at C4/C16.</text><text x="56" y="702" fill="#536575" font-size="12" font-weight="400" text-anchor="start">Hash sets match across arms, not per-request outputs. This is a Qwen check, not Praxis serving latency.</text><text x="56" y="723" fill="#536575" font-size="12" font-weight="400" text-anchor="start">Three process runs per arm; observed ranges and source pins are in the raw data and provenance.</text></svg>
