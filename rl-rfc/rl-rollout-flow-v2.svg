<text x="50" y="68" font-size="40" font-weight="bold" fill="#0F172A">One RL training step: M* runs rollouts, RLinf trains</text>
<text x="50" y="116" font-size="26" fill="#333333">Pi0.5 first (a known RLinf result), then Cosmos3 Nano with Edge for dev runs. Badges give the plan phase.</text>

