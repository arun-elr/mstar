<text x="1658" y="1118" font-size="28" font-weight="bold" fill="#111111" text-anchor="middle">clipped policy loss</text>
<text x="1658" y="1154" font-size="22" fill="#111111" text-anchor="middle">ratio = exp(new − old log-prob)</text>
